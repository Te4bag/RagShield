# RagShield Configuration
ingestion:
  chunk_size: 600
  chunk_overlap: 60

retrieval:
  top_k: 3

models:
  # Local Embedding Model
  embeddings: "all-MiniLM-L6-v2"
  # Groq Generator Model. llama-3.1-8b-instant was retired by Groq (404
  # model_not_found, 2026-09-13); gpt-oss-20b is the smallest current chat model
  # and returns its reasoning in a separate field, so the answer text is clean.
  generator: "openai/gpt-oss-20b"
  # Local NLI Model for verification
  nli_model: "cross-encoder/nli-deberta-v3-small"

verification:
  # Green gate: P(entailment) at or above this shows a sentence as verified.
  # Hand-set, then audited on RAGTruth QA (PLAN.md E4): 98.5% of test sentences
  # it turns green are supported. Must stay above 0.5, so that green always
  # means entailment is the model's most likely reading.
  entailment_threshold: 0.85
  # Low-support floor: P(entailment) below this flags a sentence orange,
  # "check it". Derived, not hand-picked: the largest value keeping the
  # false-positive rate on RAGTruth train QA sentences within 5% (5,034 answers,
  # 33,793 sentences; nli-deberta-v3-small, per-chunk scoring), rounded down.
  # Measured on RAGTruth test QA: sentence FPR 4.2%, recall 16.0%, precision
  # 21.4% -- most flagged sentences are still supported, which is why the flag
  # says "low support" and not "unsupported". Answers with any flagged sentence
  # score F1 41.9 against 30.2 for flagging every answer. It is this low because
  # the model rarely entails paraphrased answers at all. Recompute with
  # `python -m eval.calibrate`; re-derive if the model, chunking or segmenter
  # changes.
  #
  # There is no contradiction gate: red was removed (PLAN.md D7) after E4
  # measured it at 7.7% precision against a 6.7% base rate.
  low_support_threshold: 0.000552
  # How a sentence is scored against the retrieved chunks.
  #   max_entailment - each chunk is its own premise; the chunk with the
  #                    highest entailment probability decides the verdict
  #   concatenate    - all chunks joined into one premise. Eval baseline
  #                    only: it collapses most verdicts to NEUTRAL.
  aggregation: "max_entailment"
  # Pairs per forward pass. One response is n_sentences x top_k pairs, all
  # scored in a single batched call. Lower it if the GPU runs out of memory.
  batch_size: 32
  # Input budget for the cross-encoder, in tokens. DeBERTa-v3 caps at 512.
  # A longer (premise, sentence) pair is truncated silently, so the sentence
  # would be scored against a partial source. Measured with per-chunk
  # aggregation: longest pair 143 tokens at top_k 3 on the demo corpus, and 0
  # truncated pairs across all of RAGTruth test. The concatenate baseline is
  # what reaches the limit: 351 tokens at top_k 3, over it from top_k 5.
  max_length: 512
