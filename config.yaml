# RagShield Configuration
ingestion:
  chunk_size: 600
  chunk_overlap: 60

retrieval:
  top_k: 3

models:
  # Local Embedding Model
  embeddings: "all-MiniLM-L6-v2"
  # Groq Generator Model
  generator: "llama-3.1-8b-instant"
  # Local NLI Model for verification
  nli_model: "cross-encoder/nli-deberta-v3-small"

verification:
  # Score threshold to consider something "Supported"
  entailment_threshold: 0.85
  # Same floor for "Contradicted". A red underline claims the source refutes
  # the sentence, so a low-confidence CONTRADICTION falls back to NEUTRAL.
  # Both thresholds are hand-picked; deriving them from a ROC is PLAN.md E4.
  contradiction_threshold: 0.85
  # How a sentence is scored against the retrieved chunks.
  #   max_entailment - each chunk is its own premise; the chunk with the
  #                    highest entailment probability decides the verdict
  #   concatenate    - all chunks joined into one premise. Eval baseline
  #                    only: it collapses most verdicts to NEUTRAL.
  aggregation: "max_entailment"
  # Pairs per forward pass. One response is n_sentences x top_k pairs, all
  # scored in a single batched call. Lower it if the GPU runs out of memory.
  batch_size: 32
  # Input budget for the cross-encoder, in tokens. DeBERTa-v3 caps at 512.
  # A longer (premise, sentence) pair is truncated silently, so the sentence
  # would be scored against a partial source. Measured at top_k 3 with
  # per-chunk aggregation: 134 tokens, comfortably inside the budget.
  max_length: 512
